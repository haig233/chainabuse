name: ChainAbuse Scraper

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: 'Start URL index'
        required: false
        default: '0'
      end_index:
        description: 'End URL index (leave empty for all)'
        required: false
        default: ''
  schedule:
    # Run every 6 hours (adjust as needed)
    - cron: '0 */6 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    concurrency:
      group: chainabuse-scraper  # ✅ SINGLE QUEUE
      cancel-in-progress: true   # ✅ Schedule kills manual

    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install playwright pandas tqdm
    
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        playwright install-deps chromium
    
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
    
    - name: Pull latest changes
      run: |
        git pull origin main || true
    
    - name: Run scraper
      env:
        START_INDEX: ${{ github.event.inputs.start_index }}
        END_INDEX: ${{ github.event.inputs.end_index }}
      run: |
        python chainabuse_report_with_unique_id.py
    
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scraper-logs-${{ github.run_number }}
        path: |
          chainabuse_data/
          *.log
        retention-days: 7
