name: ChainAbuse Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright
        run: |
          playwright install chromium
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libatspi2.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2
      
            - name: Run scraper
              env:
                GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
                DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
              run: python scraper.py
            
            # 👇 NEW: Commit results during scraping
            - name: Commit results
              if: always()  # Run even if scraper fails
              run: |
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"
                git add output/
                git diff --quiet && git diff --staged --quiet || git commit -m "📦 Scraper progress - $(date +'%Y-%m-%d %H:%M')"
                git push || true

